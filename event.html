<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Theme Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Ella Kate Events</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="resume.html">Résumé</a></li>
          <li class="nav-item"><a class="nav-link" href="event.html">Theme Generator</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container text-center mt-5">
    <h1>Event Theme Generator</h1>
    <div class="theme-card mt-4 p-4 border rounded shadow-sm bg-light">
      <h3>Event Theme: <span id="theme-name">Tropical Luau</span></h3>
      <p id="theme-description">A fun, vibrant party with tropical decorations and delicious island-inspired food.</p>
    </div>

    <div class="mt-4">
      <button id="generate-theme-btn" class="btn btn-light generate-button">Generate New Theme</button>
      <button id="save-theme-btn" class="btn btn-light generate-button">Save This Theme</button>
      <a href="index.html" class="btn btn-light back-home-button">Go Back Home</a>
    </div>

    <div id="saved-themes" class="mt-5">
      <h4>Saved Themes:</h4>
      <ul class="list-group mx-auto" style="max-width: 500px;"></ul>
    </div>
  </div>

  <script>
    const themes = [
  { name: "🌴 Tropical Luau", description: "A fun, vibrant party with tropical decorations and delicious island-inspired food." },
  { name: "🌸 Vintage Garden Party", description: "Elegant outdoor gathering with floral decorations, vintage crockery, and delicate tea." },
  { name: "🎰 Casino Night", description: "Glamorous event with casino tables, cocktails, and a thrilling atmosphere." },
  { name: "🌼 Boho Picnic", description: "Casual and laid-back with bohemian style decor and cozy blankets for a relaxed event." },
  { name: "🎭 Masquerade Ball", description: "Mystical and elegant, with guests wearing masks and dancing the night away." },
  { name: "🎬 Hollywood Glam", description: "Red carpet event with gold accents, paparazzi, and dramatic flair." },
  { name: "❄️ Winter Wonderland", description: "A dreamy event full of icy blues, sparkling lights, and snow-themed decor." },
  { name: "🌾 Rustic Barn Wedding", description: "Warm, romantic event with wooden decor, fairy lights, and vintage accents." },
  { name: "🧚 Enchanted Forest", description: "Whimsical and magical, full of greenery, twinkle lights, and fairy elements." },
  { name: "🪩 Disco Fever", description: "Retro 70s themed party with a dance floor, disco balls, and funky music." }
];


    const button = document.getElementById('generate-theme-btn');
    const saveButton = document.getElementById('save-theme-btn');
    const themeNameElement = document.getElementById('theme-name');
    const themeDescriptionElement = document.getElementById('theme-description');
    const savedThemesList = document.querySelector('#saved-themes ul');

    let currentTheme = themes[0];

    button.addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * themes.length);
      currentTheme = themes[randomIndex];
      themeNameElement.textContent = currentTheme.name;
      themeDescriptionElement.textContent = currentTheme.description;
    });

    saveButton.addEventListener('click', () => {
      const listItem = document.createElement('li');
      listItem.className = 'list-group-item';
      listItem.textContent = `${currentTheme.name} - ${currentTheme.description}`;
      savedThemesList.appendChild(listItem);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
